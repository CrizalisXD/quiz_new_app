flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/images/logo/logo_game.png
  remove_alpha_ios: true
  android_12:
    image: assets/images/logo/logo_game_android12.png
    color: "#E6F7F5"
    # Можно использовать цвет вместо файла: icon_background: "#ffffff"
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  web: false

  # общий сплэш (до Android 11 включительно и iOS)
  background_image: assets/images/backgrounds/splash/background_splash.png
  image: assets/images/logo/logo_game.png

  # отдельные требования Android 12+
  android_12:
    color: "#E6F7F5"
    image: assets/images/logo/logo_game.png
    android_gravity: center